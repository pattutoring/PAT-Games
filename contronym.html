<script>


/* =========================================================
   ANALYTICS
========================================================= */

function trackContronymEvent(
  eventName,
  puzzle,
  extraData
) {

  if (
    typeof gtag !==
    "function"
  ) {

    return;

  }


  const data = {

    game_name:
      "contronym",

    mode:
      "majorana_of_meaning",

    puzzle_number:
      puzzle.number

  };


  if (
    extraData
  ) {

    Object.assign(
      data,
      extraData
    );

  }


  gtag(
    "event",
    eventName,
    data
  );

}



/* =========================================================
   PUZZLE DATABASE

   ADD NEW PUZZLES TO THE BOTTOM.

   THE LAST PUZZLE AUTOMATICALLY BECOMES
   THE CURRENT PUZZLE.
========================================================= */

const puzzles = [

  {

    number:
      "001",

    date:
      "June 2026",

    word:
      "SANCTION",


    hints: [

      {
        word:
          "restrict",

        charge:
          "-"
      },

      {
        word:
          "permit",

        charge:
          "+"
      },

      {
        word:
          "penalize",

        charge:
          "-"
      },

      {
        word:
          "authorize",

        charge:
          "+"
      },

      {
        word:
          "punish",

        charge:
          "-"
      },

      {
        word:
          "approve",

        charge:
          "+"
      }

    ],


    message:
      "A word that can officially approve or penalize depending on context.",


    positiveDefinition:
      "to officially approve, permit, or authorize something.",


    negativeDefinition:
      "to penalize, punish, or place restrictions on someone or something.",


    positiveExample:
      "The committee sanctioned the proposal.",


    negativeExample:
      "The league sanctioned the player.",


    footer:
      "Context determines charge. Play again next week at PAT Tutoring."

  }


  /*
  =========================================================
  PUZZLE #002 TEMPLATE

  Add a comma after Puzzle #001, then paste:

  {
    number: "002",
    date: "August 2026",

    word: "YOURWORD",

    hints: [
      { word: "negative hint", charge: "-" },
      { word: "positive hint", charge: "+" },
      { word: "negative hint", charge: "-" },
      { word: "positive hint", charge: "+" },
      { word: "negative hint", charge: "-" },
      { word: "positive hint", charge: "+" }
    ],

    message:
      "Your short puzzle explanation.",

    positiveDefinition:
      "Positive definition.",

    negativeDefinition:
      "Negative definition.",

    positiveExample:
      "Positive example sentence.",

    negativeExample:
      "Negative example sentence.",

    footer:
      "Context determines charge. Play again next week at PAT Tutoring."
  }
  =========================================================
  */

];



/* =========================================================
   GAME STATE
========================================================= */

const currentPuzzle =
  puzzles[
    puzzles.length - 1
  ];


let puzzle =
  currentPuzzle;


let word =
  puzzle.word.toUpperCase();


let visibleHintCount =
  2;


let attempts =
  0;


let solved =
  false;


let hintsUsed =
  0;


/*
  ANALYTICS STATE

  Prevents repeated checks or shares
  from inflating solve/reveal totals.
*/

let solveTracked =
  false;


let revealTracked =
  false;


let currentPuzzleArchived =
  false;



/* =========================================================
   GAME ENGINE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {


  const answerBoxes =
    document.getElementById(
      "answer-boxes"
    );


  const hintText =
    document.getElementById(
      "hint-text"
    );


  const showHintBtn =
    document.getElementById(
      "show-hint"
    );


  const submitBtn =
    document.getElementById(
      "submit-answer"
    );


  const resetBtn =
    document.getElementById(
      "reset-puzzle"
    );


  const message =
    document.getElementById(
      "message"
    );


  const attemptsText =
    document.getElementById(
      "attempts"
    );


  const leftLabel =
    document.getElementById(
      "left-label"
    );


  const rightLabel =
    document.getElementById(
      "right-label"
    );


  const resultCard =
    document.getElementById(
      "result-card"
    );


  const resultTitle =
    document.getElementById(
      "result-title"
    );


  const definitionBox =
    document.getElementById(
      "definition-box"
    );


  const sharePreview =
    document.getElementById(
      "share-preview"
    );


  const nativeShareBtn =
    document.getElementById(
      "native-share"
    );


  const copyShareBtn =
    document.getElementById(
      "copy-share"
    );


  const currentTab =
    document.getElementById(
      "current-tab"
    );


  const archiveTab =
    document.getElementById(
      "archive-tab"
    );


  const playView =
    document.getElementById(
      "play-view"
    );


  const archiveView =
    document.getElementById(
      "archive-view"
    );


  const archiveList =
    document.getElementById(
      "archive-list"
    );


  const footerNote =
    document.getElementById(
      "footer-note"
    );



  /* =======================================================
     HINTS
  ======================================================= */

  function renderHints() {

    const shownHints =
      puzzle.hints.slice(
        0,
        visibleHintCount
      );


    leftLabel.innerHTML =
      shownHints
        .filter(
          function (hint) {

            return (
              hint.charge ===
              "-"
            );

          }
        )
        .map(
          function (hint) {

            return (
              hint.word
              +
              "<sup>−</sup>"
            );

          }
        )
        .join(
          "<br>"
        )
      ||
      "negative";


    rightLabel.innerHTML =
      shownHints
        .filter(
          function (hint) {

            return (
              hint.charge ===
              "+"
            );

          }
        )
        .map(
          function (hint) {

            return (
              hint.word
              +
              "<sup>+</sup>"
            );

          }
        )
        .join(
          "<br>"
        )
      ||
      "positive";


    hintText.textContent =
      puzzle.message;


    showHintBtn.textContent =
      visibleHintCount >=
      puzzle.hints.length
      ?
        "Show Full Hint"
      :
        "Reveal Hint Word";

  }



  /* =======================================================
     ANSWER BOXES
  ======================================================= */

  function createBoxes() {

    answerBoxes.innerHTML =
      "";


    word =
      puzzle.word.toUpperCase();


    for (
      let i = 0;
      i < word.length;
      i++
    ) {

      const box =
        document.createElement(
          "input"
        );


      box.type =
        "text";


      box.maxLength =
        1;


      box.className =
        "letter-box";


      box.dataset.index =
        i;


      box.autocomplete =
        "off";


      box.inputMode =
        "text";


      answerBoxes.appendChild(
        box
      );

    }

  }



  function getGuess() {

    return Array
      .from(
        answerBoxes.children
      )
      .map(
        function (box) {

          return box.value
            .toUpperCase();

        }
      )
      .join(
        ""
      );

  }



  /* =======================================================
     STATUS
  ======================================================= */

  function updateAttempts() {

    attemptsText.textContent =
      "Contronym #"
      +
      puzzle.number
      +
      " • Attempts: "
      +
      attempts
      +
      " / 3 • Hints used: "
      +
      hintsUsed;

  }



  function lockGame() {

    Array
      .from(
        answerBoxes.children
      )
      .forEach(
        function (box) {

          box.disabled =
            true;

        }
      );


    submitBtn.disabled =
      true;


    showHintBtn.disabled =
      true;

  }



  function resultPhrase() {

    if (
      !solved
    ) {

      return (
        "No Majorana found"
      );

    }


    if (
      attempts ===
      1
    ) {

      return (
        "Majorana in One"
      );

    }


    if (
      attempts ===
      2
    ) {

      return (
        "Majorana in Two"
      );

    }


    return (
      "Majorana in Three"
    );

  }



  /* =======================================================
     SHARE TEXT
  ======================================================= */

  function shareText() {

    const positiveHint =
      puzzle.hints.find(
        function (hint) {

          return (
            hint.charge ===
            "+"
          );

        }
      )?.word
      ||
      "positive";


    const negativeHint =
      puzzle.hints.find(
        function (hint) {

          return (
            hint.charge ===
            "-"
          );

        }
      )?.word
      ||
      "negative";


    return (
      "Cν Contronym #"
      +
      puzzle.number
      +
      "\n"
      +
      resultPhrase()
      +
      "\nAttempts: "
      +
      attempts
      +
      "/3"
      +
      "\nHints used: "
      +
      hintsUsed
      +
      "\nWord: "
      +
      (
        solved
        ?
          puzzle.word
        :
          "Unsolved"
      )
      +
      "\n\n+ "
      +
      positiveHint
      +
      "\n− "
      +
      negativeHint
      +
      "\n\n"
      +
      puzzle.footer
    );

  }



  /* =======================================================
     RESULT
  ======================================================= */

  function showResult() {

    resultCard.style.display =
      "block";


    resultTitle.textContent =
      resultPhrase()
      +
      " • Contronym #"
      +
      puzzle.number;


    definitionBox.innerHTML =
      `
      <strong>${puzzle.word}</strong><br>
      <em>${puzzle.date}</em><br><br>

      <strong>Positive charge (+):</strong>
      ${puzzle.positiveDefinition}<br>

      <em>${puzzle.positiveExample}</em><br><br>

      <strong>Negative charge (−):</strong>
      ${puzzle.negativeDefinition}<br>

      <em>${puzzle.negativeExample}</em><br><br>

      <strong>Field Note:</strong>
      ${puzzle.footer}
      `;


    sharePreview.textContent =
      shareText();

  }



  /* =======================================================
     SUBMIT
  ======================================================= */

  function submitGuess() {

    if (
      solved
      ||
      attempts >=
      3
    ) {

      return;

    }


    const guess =
      getGuess();


    if (
      Array
        .from(
          answerBoxes.children
        )
        .some(
          function (box) {

            return (
              box.value ===
              ""
            );

          }
        )
    ) {

      message.textContent =
        "Fill in every box before submitting.";


      return;

    }


    attempts++;


    updateAttempts();


    /* =====================================================
       CORRECT
    ===================================================== */

    if (
      guess ===
      word
    ) {

      solved =
        true;


      message.textContent =
        resultPhrase()
        +
        " — you found the Majorana of Meaning.";


      lockGame();


      showResult();


      /*
        COUNT SOLVE ONCE
      */

      if (
        !solveTracked
      ) {

        solveTracked =
          true;


        trackContronymEvent(
          "puzzle_solved",
          puzzle,
          {

            attempts:
              attempts,

            hints_used:
              hintsUsed,

            archived:
              currentPuzzleArchived

          }
        );

      }


      return;

    }



    /* =====================================================
       THREE FAILED ATTEMPTS

       This counts as puzzle_revealed,
       NOT puzzle_solved.
    ===================================================== */

    if (
      attempts >=
      3
    ) {

      message.textContent =
        "The Majorana was "
        +
        word
        +
        ".";


      lockGame();


      showResult();


      if (
        !revealTracked
      ) {

        revealTracked =
          true;


        trackContronymEvent(
          "puzzle_revealed",
          puzzle,
          {

            attempts:
              attempts,

            hints_used:
              hintsUsed,

            reason:
              "attempts_exhausted",

            archived:
              currentPuzzleArchived

          }
        );

      }


      return;

    }



    /* =====================================================
       WRONG BUT ATTEMPTS REMAIN
    ===================================================== */

    message.textContent =
      "Not quite — charge mismatch. "
      +
      (
        3 -
        attempts
      )
      +
      " attempt"
      +
      (
        (
          3 -
          attempts
        )
        ===
        1
        ?
          ""
        :
          "s"
      )
      +
      " left.";

  }



  /* =======================================================
     RESET PUZZLE
  ======================================================= */

  function resetPuzzle() {

    attempts =
      0;


    solved =
      false;


    hintsUsed =
      0;


    visibleHintCount =
      2;


    solveTracked =
      false;


    revealTracked =
      false;


    createBoxes();


    submitBtn.disabled =
      false;


    showHintBtn.disabled =
      false;


    renderHints();


    updateAttempts();


    hintText.style.display =
      "none";


    message.textContent =
      "";


    resultCard.style.display =
      "none";


    footerNote.textContent =
      puzzle.footer;


    if (
      answerBoxes.children[0]
    ) {

      answerBoxes
        .children[0]
        .focus();

    }

  }



  /* =======================================================
     LOAD PUZZLE
  ======================================================= */

  function loadPuzzle(
    selectedPuzzle,
    archived
  ) {

    puzzle =
      selectedPuzzle;


    word =
      puzzle.word.toUpperCase();


    currentPuzzleArchived =
      Boolean(
        archived
      );


    resetPuzzle();


    playView.style.display =
      "flex";


    archiveView.style.display =
      "none";


    currentTab
      .classList
      .remove(
        "active"
      );


    archiveTab
      .classList
      .remove(
        "active"
      );


    /*
      THIS IS A REAL PUZZLE START
    */

    trackContronymEvent(
      "puzzle_started",
      puzzle,
      {

        archived:
          currentPuzzleArchived

      }
    );


    window.scrollTo(
      {
        top:
          0,

        behavior:
          "smooth"
      }
    );

  }



  /* =======================================================
     ARCHIVE
  ======================================================= */

  function buildArchive() {

    archiveList.innerHTML =
      "";


    const oldPuzzles =
      puzzles
        .slice(
          0,
          -1
        )
        .reverse();


    if (
      oldPuzzles.length ===
      0
    ) {

      archiveList.innerHTML =
        `
        <div class="empty-archive">
          No past puzzles yet.
          <br><br>
          Puzzle #001 will move here automatically
          when #002 is added.
        </div>
        `;


      return;

    }


    oldPuzzles.forEach(
      function (oldPuzzle) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "archive-card";


        card.innerHTML =
          `
          <div class="archive-number">
            Contronym #${oldPuzzle.number}
          </div>

          <div class="archive-date">
            ${oldPuzzle.date}
          </div>

          <div class="archive-description">
            Revisit this Majorana of Meaning.
            The answer stays hidden until you solve or reveal it.
          </div>

          <button class="archive-play">
            Play Puzzle #${oldPuzzle.number}
          </button>
          `;


        card
          .querySelector(
            ".archive-play"
          )
          .addEventListener(
            "click",
            function () {

              loadPuzzle(
                oldPuzzle,
                true
              );

            }
          );


        archiveList.appendChild(
          card
        );

      }
    );

  }



  /* =======================================================
     CURRENT PUZZLE TAB
  ======================================================= */

  currentTab.addEventListener(
    "click",
    function () {

      puzzle =
        currentPuzzle;


      currentPuzzleArchived =
        false;


      resetPuzzle();


      playView.style.display =
        "flex";


      archiveView.style.display =
        "none";


      currentTab.classList.add(
        "active"
      );


      archiveTab.classList.remove(
        "active"
      );


      trackContronymEvent(
        "puzzle_started",
        puzzle,
        {

          archived:
            false

        }
      );

    }
  );



  /* =======================================================
     ARCHIVE TAB
  ======================================================= */

  archiveTab.addEventListener(
    "click",
    function () {

      buildArchive();


      playView.style.display =
        "none";


      archiveView.style.display =
        "block";


      archiveTab.classList.add(
        "active"
      );


      currentTab.classList.remove(
        "active"
      );

    }
  );



  /* =======================================================
     INPUT BEHAVIOR
  ======================================================= */

  answerBoxes.addEventListener(
    "input",
    function (event) {

      const target =
        event.target;


      const index =
        parseInt(
          target.dataset.index
        );


      target.value =
        target.value
          .toUpperCase()
          .replace(
            /[^A-Z]/g,
            ""
          );


      if (
        target.value.length ===
        1
      ) {

        const next =
          answerBoxes.children[
            index + 1
          ];


        if (
          next
        ) {

          next.focus();

        }

      }

    }
  );



  answerBoxes.addEventListener(
    "keydown",
    function (event) {

      const target =
        event.target;


      const index =
        parseInt(
          target.dataset.index
        );


      if (
        event.key ===
        "Backspace"
        &&
        target.value ===
        ""
      ) {

        const previous =
          answerBoxes.children[
            index - 1
          ];


        if (
          previous
        ) {

          previous.focus();

        }

      }


      if (
        event.key ===
        "Enter"
      ) {

        submitGuess();

      }

    }
  );



  /* =======================================================
     SUBMIT BUTTON
  ======================================================= */

  submitBtn.addEventListener(
    "click",
    submitGuess
  );



  /* =======================================================
     HINT BUTTON
  ======================================================= */

  showHintBtn.addEventListener(
    "click",
    function () {

      if (
        visibleHintCount <
        puzzle.hints.length
      ) {

        visibleHintCount++;


        hintsUsed++;


        renderHints();


        updateAttempts();

      }

      else {

        hintText.style.display =
          "block";

      }

    }
  );



  /* =======================================================
     RESET BUTTON
  ======================================================= */

  resetBtn.addEventListener(
    "click",
    function () {

      resetPuzzle();


      /*
        Reset begins a fresh play session.
      */

      trackContronymEvent(
        "puzzle_started",
        puzzle,
        {

          archived:
            currentPuzzleArchived,

          restarted:
            true

        }
      );

    }
  );



  /* =======================================================
     NATIVE SHARE
  ======================================================= */

  nativeShareBtn.addEventListener(
    "click",
    async function () {

      const text =
        shareText();


      if (
        navigator.share
      ) {

        try {

          await navigator.share(
            {

              title:
                "Contronym: The Majorana of Meaning",

              text:
                text,

              url:
                window.location.href

            }
          );


          /*
            Only count once the share
            sheet successfully completes.
          */

          trackContronymEvent(
            "puzzle_shared",
            puzzle,
            {

              solved:
                solved,

              attempts:
                attempts,

              hints_used:
                hintsUsed,

              share_method:
                "native",

              archived:
                currentPuzzleArchived

            }
          );

        }

        catch (
          error
        ) {

          /*
            User cancelled.
            Do not count as a share.
          */

          console.log(
            "Share cancelled."
          );

        }

      }

      else {

        try {

          await navigator
            .clipboard
            .writeText(
              text
              +
              "\n\n"
              +
              window.location.href
            );


          trackContronymEvent(
            "puzzle_shared",
            puzzle,
            {

              solved:
                solved,

              attempts:
                attempts,

              hints_used:
                hintsUsed,

              share_method:
                "clipboard",

              archived:
                currentPuzzleArchived

            }
          );


          nativeShareBtn.textContent =
            "Copied!";


          setTimeout(
            function () {

              nativeShareBtn.textContent =
                "Share";

            },
            1200
          );

        }

        catch (
          error
        ) {

          console.log(
            "Copy failed."
          );

        }

      }

    }
  );



  /* =======================================================
     COPY SHARE
  ======================================================= */

  copyShareBtn.addEventListener(
    "click",
    async function () {

      const text =
        shareText();


      try {

        await navigator
          .clipboard
          .writeText(
            text
            +
            "\n\n"
            +
            window.location.href
          );


        /*
          A successful copy counts
          as a share action.
        */

        trackContronymEvent(
          "puzzle_shared",
          puzzle,
          {

            solved:
              solved,

            attempts:
              attempts,

            hints_used:
              hintsUsed,

            share_method:
              "clipboard_social",

            archived:
              currentPuzzleArchived

          }
        );


        copyShareBtn.textContent =
          "Copied!";


        setTimeout(
          function () {

            copyShareBtn.textContent =
              "Copy for Instagram/Facebook";

          },
          1200
        );

      }

      catch (
        error
      ) {

        alert(
          text
        );

      }

    }
  );



  /* =======================================================
     START

     Opening contronym.html means the
     current puzzle has been presented,
     so we count that as puzzle_started.
  ======================================================= */

  currentPuzzleArchived =
    false;


  resetPuzzle();


  trackContronymEvent(
    "puzzle_started",
    currentPuzzle,
    {

      archived:
        false

    }
  );


});

</script>


</body>

</html>
